[build]
  base = "/"
  publish = "frontend/dist"
  command = "bash ./netlify-build.sh"

[build.environment]
  NODE_VERSION = "20.18.0"
  SKIP_TYPESCRIPT_CHECK = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  framework = "#static"
  command = "node keep-server-running.js"
  port = 5173
  targetPort = 5173
  publish = "frontend/public"
  autoLaunch = true

# Edge Functions
[[edge_functions]]
  path = "/spotify/*"
  function = "spotify-api"

# Add redirect for Spotify API paths
[[redirects]]
  from = "/spotify/*"
  to = "/.netlify/functions/spotify-search"
  status = 200
  force = true

# Handle direct function request for testing deployment
[[redirects]]
  from = "/test"
  to = "/.netlify/functions/hello-world"
  status = 200
  force = true

# Handle environment test requests
[[redirects]]
  from = "/env-test"
  to = "/.netlify/functions/env-test"
  status = 200
  force = true

# Spotify OAuth token exchange and refresh run server-side, so the
# client secret never reaches the browser bundle
[[redirects]]
  from = "/apis/spotify_auth/token"
  to = "/.netlify/functions/spotify-token"
  status = 200
  force = true

[[redirects]]
  from = "/apis/spotify_auth/refresh"
  to = "/.netlify/functions/spotify-token"
  status = 200
  force = true

# Handle API routes according to our API path structure
[[redirects]]
  from = "/routes/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Handle Spotify auth callback
[[redirects]]
  from = "/auth/callback"
  to = "/index.html"
  status = 200
  force = true

# Handle all other API requests
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Handle SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Not launched: keep the whole host out of search indexes until it is.
# queuebeats.netlify.app served a blank "Databutton" shell answering 200 on
# every path (SEO audit 74d88b17 row 24, 18.11.2026). Remove at launch.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
